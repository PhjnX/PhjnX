<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 40) rotate(140) scale(420 260)">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Left: intro -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <rect x="64" y="66" width="148" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.35"/>
    <circle cx="82" cy="80" r="4" fill="#4ADE80"/>
    <text x="94" y="85" font-size="13" font-weight="600" fill="#7DD3FC" letter-spacing="0.5">OPEN TO WORK</text>

    <text x="62" y="148" font-size="50" font-weight="700" fill="#F8FAFC" letter-spacing="-1">Bui Hoang Phi</text>
    <text x="64" y="190" font-size="24" font-weight="600" fill="url(#accent)">Frontend Developer</text>
    <text x="64" y="228" font-size="17" fill="#94A3B8">React · React Native · Next.js · WordPress</text>
    <text x="64" y="258" font-size="15" fill="#64748B">Ho Chi Minh City, Vietnam</text>
  </g>

  <!-- Right: code window -->
  <g transform="translate(650 52)">
    <rect width="490" height="216" rx="12" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M0 12a12 12 0 0 1 12-12h466a12 12 0 0 1 12 12v24H0z" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="22" cy="18" r="5" fill="#F87171"/>
    <circle cx="40" cy="18" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="18" r="5" fill="#4ADE80"/>
    <text x="245" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748B">phi.ts</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
      <text x="24" y="70"><tspan fill="#C084FC">const</tspan><tspan fill="#E2E8F0"> phi </tspan><tspan fill="#94A3B8">= {</tspan></text>
      <text x="48" y="98"><tspan fill="#7DD3FC">role</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#86EFAC">"Frontend Developer"</tspan><tspan fill="#94A3B8">,</tspan></text>
      <text x="48" y="126"><tspan fill="#7DD3FC">stack</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#86EFAC">"React"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#86EFAC">"Next.js"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#86EFAC">"RN"</tspan><tspan fill="#94A3B8">],</tspan></text>
      <text x="48" y="154"><tspan fill="#7DD3FC">cms</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#86EFAC">"WordPress"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#86EFAC">"WooCommerce"</tspan><tspan fill="#94A3B8">],</tspan></text>
      <text x="48" y="182"><tspan fill="#7DD3FC">openToWork</tspan><tspan fill="#94A3B8">: </tspan><tspan fill="#FDBA74">true</tspan><tspan fill="#94A3B8">,</tspan></text>
      <text x="24" y="206"><tspan fill="#94A3B8">};</tspan></text>
    </g>
  </g>
</svg>
